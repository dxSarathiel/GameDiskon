name: Radar Diskon Game

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 18:00 WIB (jadwal GitHub bisa telat beberapa menit)
  workflow_dispatch:        # tombol "Run workflow" untuk tes manual

permissions:
  contents: write           # perlu untuk menyimpan sent.json kembali ke repo

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Jalankan radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar_diskon.py

      - name: Simpan catatan deal dan riwayat harga
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          for f in sent.json harga_idr.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "update data harian" && git push)
