name: Radar Diskon Game

on:
  schedule:
    - cron: "17 10 * * *"   # 11:00 UTC = 18:00 WIB (jadwal GitHub bisa telat beberapa menit)
  workflow_dispatch:        # tombol "Run workflow" untuk tes manual

permissions:
  contents: write           # perlu untuk menyimpan sent.json kembali ke repo

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Jalankan radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar_diskon.py

      - name: Simpan catatan deal dan riwayat harga
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          for f in sent.json harga_idr.json docs; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "update data harian" && git push)
      - name: Upload halaman ke hosting Rumahweb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./docs/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .nojekyll
