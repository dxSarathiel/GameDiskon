name: Radar Diskon Game

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 17:17 WIB (sengaja bukan jam bulat supaya tidak antre lama)
  workflow_dispatch:        # tombol "Run workflow" untuk tes manual

permissions:
  contents: write           # perlu untuk menyimpan sent.json kembali ke repo

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Jalankan radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: python radar_diskon.py

      - name: Simpan catatan deal dan riwayat harga
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          for f in sent.json harga_idr.json docs; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "update data harian" && git push)
      - name: Terbitkan ke hosting (hosting menarik docs dari GitHub)
        id: tarik
        continue-on-error: true   # kalau gagal, upload FTP di bawah jadi cadangan
        env:
          KUNCI: ${{ secrets.ALARM_KUNCI }}
        run: |
          if [ -z "$KUNCI" ]; then echo "Secret ALARM_KUNCI kosong"; exit 1; fi
          SHA=$(git rev-parse HEAD)
          # Perlindungan anti-bot hosting kadang membalas dengan halaman "One moment, please...": coba sampai 4 kali
          for i in 1 2 3 4; do
            HASIL=$(curl -sS --max-time 240 -X POST -H "X-Kunci: $KUNCI" "https://gamediskon.my.id/bot/tarik.php?sha=$SHA" || true)
            if echo "$HASIL" | grep -q '"ok":true'; then echo "$HASIL"; exit 0; fi
            echo "Percobaan $i belum berhasil: $(echo "$HASIL" | head -c 120)"
            sleep 20
          done
          exit 1

      - name: Upload halaman ke hosting Rumahweb
        id: upload1
        if: steps.tarik.outcome != 'success'
        continue-on-error: true   # kalau gagal, dicoba sekali lagi di bawah
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./docs/
          server-dir: ./
          timeout: 120000          # 2 menit per operasi FTP (bawaan hanya 30 detik)
          exclude: |
            **/.git*
            **/.git*/**
            .nojekyll

      - name: Tunggu sebentar sebelum mencoba lagi
        if: steps.upload1.outcome == 'failure'
        run: sleep 90

      - name: Upload ulang (percobaan kedua)
        id: upload2
        if: steps.upload1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./docs/
          server-dir: ./
          timeout: 120000          # 2 menit per operasi FTP (bawaan hanya 30 detik)
          exclude: |
            **/.git*
            **/.git*/**
            .nojekyll

      - name: Kirim alarm harga
        # Hanya kalau upload berhasil, supaya bot di hosting membaca harga hari ini
        if: steps.tarik.outcome == 'success' || steps.upload1.outcome == 'success' || steps.upload2.outcome == 'success'
        env:
          KUNCI: ${{ secrets.ALARM_KUNCI }}
        run: |
          if [ -z "$KUNCI" ]; then echo "Secret ALARM_KUNCI belum diisi, alarm harga dilewati."; exit 0; fi
          # Pastikan yang menjawab benar-benar periksa.php (bukan halaman anti-bot): coba sampai 4 kali
          for i in 1 2 3 4; do
            HASIL=$(curl -sS --max-time 120 -X POST -H "X-Kunci: $KUNCI" https://gamediskon.my.id/bot/periksa.php || true)
            if echo "$HASIL" | grep -q '"alarm_aktif"'; then echo "$HASIL"; exit 0; fi
            echo "Percobaan $i belum berhasil: $(echo "$HASIL" | head -c 120)"
            sleep 20
          done
          exit 1

      - name: Kabari pemilik kalau ada langkah yang gagal
        # Berjalan hanya kalau salah satu langkah di atas gagal (misalnya upload FTP, simpan data, atau alarm harga)
        if: failure() || steps.tarik.outcome == 'failure'
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PEMILIK: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PEMILIK" ]; then exit 0; fi
          LOG="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$PEMILIK" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=🚨 Workflow Radar Diskon: ada langkah yang gagal (penerbitan ke hosting, simpan data, atau alarm harga). Kalau penerbitan lewat tarik.php gagal, upload FTP dipakai sebagai cadangan. Cek log: $LOG" > /dev/null
