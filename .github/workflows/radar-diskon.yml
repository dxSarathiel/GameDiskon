name: Radar Diskon Game

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 17:17 WIB (sengaja bukan jam bulat supaya tidak antre lama)
  workflow_dispatch:        # tombol "Run workflow" untuk tes manual

permissions:
  contents: write           # perlu untuk menyimpan sent.json kembali ke repo

# Run manual dan run dari pemicu hosting tidak boleh jalan bersamaan: yang kedua menunggu yang
# pertama selesai, supaya push sent.json tidak saling tolak (deal bisa terkirim ulang)
concurrency:
  group: radar-diskon
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-24.04   # dikunci supaya tidak ikut pindah otomatis ke Ubuntu 26 (Okt 2026)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Untuk video animasi HyperFrames (video_hf/). Kalau salah satu tidak tersedia,
      # video.py otomatis memakai video slide biasa, jadi radar tetap jalan.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Pasang FFmpeg untuk render video
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Runner selalu mesin baru: unduh Chrome versi HyperFrames dulu. Kalau langkah ini gagal,
      # radar tetap jalan dan video.py memakai video slide biasa (pemilik dikabari lewat Telegram).
      - name: Siapkan Chrome HyperFrames
        continue-on-error: true
        working-directory: video_hf
        run: |
          # Ubuntu 24.04 membatasi sandbox Chrome; aman dilonggarkan di runner sekali pakai ini
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          HF=$(grep -oE 'hyperframes@[0-9]+\.[0-9]+\.[0-9]+' package.json | head -1)
          npx --yes "$HF" browser ensure
          npx --yes "$HF" doctor || true   # hanya diagnosis di log (Docker dll. memang tidak dipakai)

      - name: Jalankan radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          # Suara TTS untuk video: ElevenLabs bila secret ini ada, kalau gagal/kosong pakai Microsoft Edge TTS
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}   # kosong = suara Iwan
          # Suara cadangan gratis (Microsoft Edge TTS) bila ElevenLabs gagal/tidak diset; kosong = id-ID-ArdiNeural
          EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE }}
        run: python radar_diskon.py

      - name: Simpan catatan deal dan riwayat harga
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          for f in sent.json harga_idr.json docs; do if [ -e "$f" ]; then git add "$f"; fi; done
          # pull dulu: kalau ada upload lewat web selama run berjalan, push tidak ditolak
          git diff --cached --quiet || (git commit -m "update data harian" && git pull --rebase --autostash && git push)
      # Penerbitan ke hosting dan pemeriksaan alarm harga sekarang dijalankan oleh Cron Job cPanel
      # di hosting sendiri (bot/tarik.php tiap 30 menit, bot/periksa.php tiap 2 jam), jadi tidak kena
      # perlindungan anti-bot hosting dan tidak perlu upload FTP lagi.

      - name: Kabari pemilik kalau ada langkah yang gagal
        # Berjalan hanya kalau salah satu langkah di atas gagal (misalnya upload FTP, simpan data, atau alarm harga)
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PEMILIK: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PEMILIK" ]; then exit 0; fi
          LOG="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$PEMILIK" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=🚨 Workflow Radar Diskon GAGAL (bot atau penyimpanan data ke repo). Situs tidak akan diperbarui sampai ini beres. Cek log: $LOG" > /dev/null
