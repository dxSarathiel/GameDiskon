<!DOCTYPE html>
<html lang="id">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        /* Latar bersama untuk seluruh video: tetap di tempat saat adegan berganti,
           jadi swipe terasa bergerak di atas satu dunia yang sama.
           Tema "Shonen Sale" (sama dengan situs): tinta gelap, screentone manga, garis kecepatan kuning tipis. */
        #latar { position: absolute; inset: 0; overflow: hidden; background: #0a0b12; }
        #latar-titik, #latar-titik-b, #latar-cepat { position: absolute; display: block; will-change: transform; }
        /* screentone di pojok kanan atas (seperti .pita::before di situs) */
        #latar-titik { right: -80px; top: -80px; width: 1240px; height: 1240px;
          background: radial-gradient(circle, rgba(241, 242, 246, 0.18) 2.6px, transparent 3.8px) 0 0 / 16px 16px;
          -webkit-mask-image: radial-gradient(ellipse at 100% 0, #000 5%, transparent 68%); mask-image: radial-gradient(ellipse at 100% 0, #000 5%, transparent 68%); }
        /* screentone kecil di pojok kiri bawah */
        #latar-titik-b { left: -60px; bottom: -60px; width: 760px; height: 760px;
          background: radial-gradient(circle, rgba(241, 242, 246, 0.12) 2.6px, transparent 3.8px) 0 0 / 16px 16px;
          -webkit-mask-image: radial-gradient(ellipse at 0 100%, #000 5%, transparent 66%); mask-image: radial-gradient(ellipse at 0 100%, #000 5%, transparent 66%); }
        /* garis kecepatan manga: cincin di tepi layar, pusat sedikit di atas tengah */
        #latar-cepat { left: -760px; top: -400px; width: 2600px; height: 2600px;
          background: repeating-conic-gradient(from 3deg at 50% 50%, rgba(246, 225, 70, 0.07) 0deg 0.8deg, transparent 0.8deg 6deg);
          -webkit-mask-image: radial-gradient(closest-side, transparent 42%, #000 62%, transparent 96%); mask-image: radial-gradient(closest-side, transparent 42%, #000 62%, transparent 96%); }
      </style>

      <div id="latar" data-composition-id="latar" data-width="1080" data-height="1920">
        <div id="latar-cepat" data-layout-allow-overflow=""></div>
        <div id="latar-titik" data-layout-allow-overflow=""></div>
        <div id="latar-titik-b" data-layout-allow-overflow=""></div>
      </div>

      <script>
        (function () {
          const D = {{DATA}};
          const tl = gsap.timeline({ paused: true });
          // Garis kecepatan berputar pelan dan screentone hanyut sepanjang video (gerak terbatas, bukan loop tak hingga)
          tl.fromTo("#latar-cepat", { rotation: 0 }, { rotation: Math.min(12, D.durasi * 0.3), duration: D.durasi, ease: "none" }, 0);
          tl.fromTo("#latar-titik", { x: 0, y: 0 }, { x: -32, y: 48, duration: D.durasi, ease: "none" }, 0);
          tl.fromTo("#latar-titik-b", { x: 0, y: 0 }, { x: 24, y: -32, duration: D.durasi, ease: "none" }, 0);
          window.__timelines["latar"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
