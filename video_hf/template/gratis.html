<!DOCTYPE html>
<html lang="id">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Archivo"; src: url(assets/fonts/archivo-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%;
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: "Archivo"; src: url(assets/fonts/archivo-latin-ext.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%;
          unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2C60-2C7F, U+A720-A7FF; }
        /* Huruf Jepang (Dela Gothic One, subset sama dengan situs) */
        @font-face { font-family: "Manga"; src: url(assets/fonts/dela-gothic-jp.woff2) format("woff2"); font-weight: 400; }
        #{{ID}} { position: absolute; inset: 0; overflow: hidden; color: #f1f2f6; font-family: "Archivo", system-ui, sans-serif; }
        /* garis kecepatan kuning mekar di belakang kartu: tanda ganti topik */
        #{{ID}}-cepat { position: absolute; left: -660px; top: -400px; width: 2400px; height: 2400px; display: block; opacity: 0;
          background: repeating-conic-gradient(from 3deg at 50% 50%, rgba(246, 225, 70, 0.2) 0deg 1.2deg, transparent 1.2deg 7deg);
          -webkit-mask-image: radial-gradient(closest-side, transparent 30%, #000 48%, transparent 82%); mask-image: radial-gradient(closest-side, transparent 30%, #000 48%, transparent 82%); }
        #{{ID}} .stack { position: absolute; inset: 0; padding: 110px 54px 330px; display: flex; flex-direction: column; justify-content: center; }
        #{{ID}}-kicker { display: flex; align-items: center; gap: 22px; margin-bottom: 34px; font-size: 40px; font-weight: 800; letter-spacing: 0.14em;
          text-transform: uppercase; color: #f6e146; opacity: 0; }
        #{{ID}}-kicker::before { content: ""; width: 64px; height: 20px; flex: none; background: #f6e146; clip-path: polygon(9px 0, 100% 0, calc(100% - 9px) 100%, 0 100%); }
        #{{ID}} .cwrap { position: relative; }
        #{{ID}}-card { position: relative; background: #12141e; overflow: hidden; clip-path: polygon(0 0, calc(100% - 44px) 0, 100% 44px, 100% 100%, 0 100%); }
        #{{ID}}-garis { position: absolute; left: 0; bottom: 0; width: 100%; height: 8px; display: block; background: #f6e146; transform: scaleX(0.18); transform-origin: 0% 50%; }
        #{{ID}} .cover { position: relative; height: 545px; overflow: hidden; background: #1b1e2b; }
        #{{ID}}-img { position: absolute; inset: -30px; display: block; background-size: cover; background-position: center; }
        #{{ID}} .body { padding: 50px 100px 64px 54px; display: flex; flex-direction: column; }
        #{{ID}}-nama { font-size: 82px; font-weight: 800; line-height: 1.06; opacity: 0;
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        #{{ID}}-ket { margin-top: 36px; font-size: 46px; color: #a7acbe; opacity: 0; }
        #{{ID}} .batas-wrap { position: relative; align-self: flex-start; margin-top: 46px; padding: 0 30px; }
        #{{ID}}-batas { display: block; font-size: 108px; font-weight: 900; font-stretch: 75%; line-height: 1.1; color: #f6e146; font-variant-numeric: tabular-nums; white-space: nowrap; opacity: 0; }
        #{{ID}} .ring { position: absolute; left: -2%; top: -24%; width: 104%; height: 148%; overflow: visible; }
        #{{ID}}-ring { fill: none; stroke: #f1f2f6; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
        #{{ID}}-milik { margin-top: 44px; font-size: 44px; opacity: 0; }
        /* Gelembung ledakan manga 無料 / GRATIS (sama dengan .stempel di situs) */
        #{{ID}} .stamp-rot { position: absolute; left: -14px; top: -40px; transform: rotate(-10deg); filter: drop-shadow(7px 9px 0 #0a0b12); }
        #{{ID}}-stamp { position: relative; isolation: isolate; width: 280px; height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
          color: #0a0b12; font-size: 32px; font-weight: 900; letter-spacing: 0.12em; line-height: 1; opacity: 0; }
        #{{ID}}-stamp::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #f6e146;
          clip-path: polygon(50% 0%, 59% 15%, 75% 5%, 75% 22%, 93% 18%, 85% 34%, 100% 42%, 86% 53%, 97% 68%, 80% 70%, 82% 88%, 66% 80%, 58% 97%, 48% 83%, 35% 98%, 31% 81%, 14% 88%, 17% 70%, 0% 66%, 13% 53%, 2% 38%, 18% 34%, 12% 16%, 30% 21%, 33% 3%, 44% 15%); }
        #{{ID}}-stamp .jp { font-family: "Manga", "Archivo", sans-serif; font-weight: 400; font-size: 78px; letter-spacing: 0.02em; }
      </style>

      <div id="{{ID}}" data-composition-id="{{ID}}" data-width="1080" data-height="1920">
        <div id="{{ID}}-cepat" data-layout-allow-overflow=""></div>
        <div class="stack">
          <div id="{{ID}}-kicker">Gratis di Epic Games Store</div>
          <div class="cwrap">
            <div id="{{ID}}-card">
              <div class="cover"><div id="{{ID}}-img" data-layout-allow-overflow="" style="background-image: url('{{GAMBAR}}')"></div></div>
              <div class="body">
                <div id="{{ID}}-nama">{{JUDUL}}</div>
                <div id="{{ID}}-ket">Klaim sebelum</div>
                <div class="batas-wrap">
                  <div id="{{ID}}-batas">{{BERAKHIR}}</div>
                  <svg class="ring" viewBox="0 0 760 190" preserveAspectRatio="none"><path id="{{ID}}-ring" pathLength="1" d="M600 16 C700 24 752 58 748 98 C744 150 590 182 380 184 C180 186 18 164 12 104 C6 52 150 14 330 10 C460 7 590 10 690 34" /></svg>
                </div>
                <div id="{{ID}}-milik">Sekali klaim, jadi milikmu selamanya.</div>
              </div>
              <i id="{{ID}}-garis"></i>
            </div>
            <div class="stamp-rot" data-layout-allow-overflow=""><div id="{{ID}}-stamp"><span class="jp">無料</span>GRATIS</div></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const D = {{DATA}};
          const P = "#{{ID}}-";
          const tl = gsap.timeline({ paused: true });
          const m = D.mulai;

          // Ganti topik: garis kecepatan kuning mekar, lalu berputar pelan (gerak terbatas)
          tl.fromTo(P + "cepat", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" }, 0);
          tl.to(P + "cepat", { rotation: 5, duration: Math.max(1, D.durasi - 0.9), ease: "none" }, 0.9);

          tl.fromTo(P + "img", { scale: 1, y: 14 }, { scale: 1.06, y: -14, duration: D.durasi, ease: "none" }, 0);
          tl.fromTo(P + "kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, m);

          tl.set(P + "nama", { opacity: 1, y: 50 }, m + 0.2);
          tl.to(P + "nama", { y: 0, duration: 0.2, ease: "power4.out" }, m + 0.2);

          // Gelembung 無料 dibanting: dari besar ke ukuran, power4 (hantaman, bukan pantulan); kartu ikut tergetar
          const ts = m + 0.5;
          tl.fromTo(P + "stamp", { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "power4.in" }, ts);
          tl.fromTo(P + "card", { y: 0 }, { y: 10, duration: 0.07, ease: "power2.out" }, ts + 0.32);
          tl.to(P + "card", { y: 0, duration: 0.35, ease: "power3.out" }, ts + 0.39);
          tl.fromTo(P + "garis", { scaleX: 0.18 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, ts + 0.32);

          tl.fromTo(P + "ket", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, m + 0.95);
          tl.set(P + "batas", { opacity: 1, y: 45 }, m + 1.1);
          tl.to(P + "batas", { y: 0, duration: 0.18, ease: "power4.out" }, m + 1.1);
          // Lingkaran spidol menggambar dirinya (svg-path-draw, pathLength=1)
          tl.set(P + "ring", { opacity: 1 }, m + 1.4);
          tl.fromTo(P + "ring", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, m + 1.4);
          tl.fromTo(P + "milik", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, m + 1.9);

          window.__timelines["{{ID}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
