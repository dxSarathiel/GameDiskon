<!DOCTYPE html>
<html lang="id">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Archivo"; src: url(assets/fonts/archivo-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%;
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: "Archivo"; src: url(assets/fonts/archivo-latin-ext.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%;
          unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2C60-2C7F, U+A720-A7FF; }
        /* Huruf Jepang (Dela Gothic One, subset sama dengan situs) */
        @font-face { font-family: "Manga"; src: url(assets/fonts/dela-gothic-jp.woff2) format("woff2"); font-weight: 400; }
        #{{ID}} { position: absolute; inset: 0; overflow: hidden; color: #f1f2f6; font-family: "Archivo", system-ui, sans-serif; }
        #{{ID}} .abs { position: absolute; }
        #{{ID}} .jp { font-family: "Manga", "Archivo", sans-serif; font-weight: 400; }
        #{{ID}} .kuning { color: #f6e146; }
        /* efek suara 割引 (diskon) bergaris di kanan atas */
        #{{ID}} .sfx-rot { left: 470px; top: 140px; transform: rotate(8deg); }
        #{{ID}}-sfx { display: block; font-size: 330px; line-height: 1; white-space: nowrap; color: #0a0b12; -webkit-text-stroke: 3px rgba(246, 225, 70, 0.18); opacity: 0; }
        /* Logo: label kuning miring 割 + GAMEDISKON sempit (sama dengan .logo di situs) */
        #{{ID}}-logo { left: 72px; top: 300px; display: flex; align-items: center; gap: 26px; }
        #{{ID}}-hanko { display: grid; place-items: center; width: 126px; height: 110px; flex: none; padding-top: 4px;
          background: #f6e146; color: #0a0b12; font-size: 66px; line-height: 1; clip-path: polygon(22px 0, 100% 0, calc(100% - 22px) 100%, 0 100%); opacity: 0; }
        #{{ID}} .wm { display: flex; font-size: 88px; font-weight: 900; font-stretch: 74%; letter-spacing: 0.01em; line-height: 1; }
        #{{ID}} .wm span { display: inline-block; opacity: 0; }
        /* Judul: huruf sempit miring; baris terakhir di atas blok kuning */
        #{{ID}}-judul { left: 72px; top: 500px; width: 880px; font-size: 116px; font-weight: 900; font-stretch: 68%; text-transform: uppercase; line-height: 1; }
        #{{ID}}-judul .ln { display: block; opacity: 0; }
        #{{ID}}-judul .ln > b { display: inline-block; font-weight: inherit; transform: skewX(-8deg); transform-origin: bottom left; }
        #{{ID}}-judul .ln > b.sorot { margin-top: 0.14em; padding: 0.06em 0.32em 0.02em 0.24em; background: #f6e146; color: #0a0b12;
          clip-path: polygon(0.18em 0, 100% 0, calc(100% - 0.18em) 100%, 0 100%); }
        #{{ID}} .btn-wrap { left: 72px; top: 1022px; }
        /* garis kejut manga di sekitar tombol saat ditekan */
        #{{ID}}-burst { position: absolute; inset: -140px; display: block; opacity: 0;
          background: repeating-conic-gradient(from 3deg at 50% 50%, rgba(246, 225, 70, 0.55) 0deg 1.6deg, transparent 1.6deg 9deg);
          -webkit-mask-image: radial-gradient(closest-side, transparent 52%, #000 64%, transparent 94%); mask-image: radial-gradient(closest-side, transparent 52%, #000 64%, transparent 94%); }
        #{{ID}}-btn { position: relative; display: block; font-size: 66px; font-weight: 900; padding: 26px 64px 24px; background: #f6e146; color: #0a0b12;
          clip-path: polygon(26px 0, 100% 0, calc(100% - 26px) 100%, 0 100%); transform-origin: 50% 50%; opacity: 0; }
        #{{ID}} .tg { left: 72px; opacity: 0; }
        #{{ID}} .tg .ket { font-size: 46px; color: #a7acbe; }
        #{{ID}} .tg .isi { margin-top: 6px; font-size: 76px; font-weight: 900; font-stretch: 75%; color: #f1f2f6; }
      </style>

      <div id="{{ID}}" data-composition-id="{{ID}}" data-width="1080" data-height="1920">
        <div class="abs sfx-rot" data-layout-allow-overflow=""><span id="{{ID}}-sfx" class="jp" aria-hidden="true" data-layout-allow-overflow="" data-layout-allow-overlap="">割引</span></div>
        <div class="abs" id="{{ID}}-logo">
          <div id="{{ID}}-hanko" class="jp">割</div>
          <div class="wm"><span id="{{ID}}-w1">GAME</span><span id="{{ID}}-w2" class="kuning">DISKON</span></div>
        </div>
        <div class="abs" id="{{ID}}-judul">
          <span class="ln" id="{{ID}}-l1"><b>Daftar</b></span>
          <span class="ln" id="{{ID}}-l2"><b>lengkap +</b></span>
          <span class="ln" id="{{ID}}-l3"><b>riwayat</b></span>
          <span class="ln" id="{{ID}}-l4"><b class="sorot">harga</b></span>
        </div>
        <div class="abs btn-wrap"><div id="{{ID}}-burst"></div><div id="{{ID}}-btn">gamediskon.my.id</div></div>
        {{TELEGRAM}}
      </div>

      <script>
        (function () {
          const D = {{DATA}};
          const P = "#{{ID}}-";
          const tl = gsap.timeline({ paused: true });
          const m = D.mulai;

          // Label 割 dibanting (power4: hantaman), wordmark waterfall, efek suara 割引 menyapu masuk
          tl.fromTo(P + "hanko", { scale: 1.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "power4.in" }, m);
          tl.set(P + "w1", { opacity: 1, y: 45 }, m + 0.3);
          tl.to(P + "w1", { y: 0, duration: 0.16, ease: "power4.out" }, m + 0.3);
          tl.set(P + "w2", { opacity: 1, y: 45 }, m + 0.44);
          tl.to(P + "w2", { y: 0, duration: 0.16, ease: "power4.out" }, m + 0.44);
          tl.fromTo(P + "sfx", { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, m + 0.2);
          tl.to(P + "sfx", { x: -30, duration: Math.max(0.5, D.durasi - m - 0.9), ease: "none" }, m + 0.9);

          // Judul waterfall, baris berblok kuning terakhir
          let t = m + 0.7;
          [["l1", 70, 0.18], ["l2", 50, 0.16], ["l3", 50, 0.15], ["l4", 75, 0.18]].forEach(([id, dy, d]) => {
            tl.set(P + id, { opacity: 1, y: dy }, t);
            tl.to(P + id, { y: 0, duration: d, ease: "power4.out" }, t);
            t += d - 1 / 60;
          });

          // Tombol situs: pop, lalu ditekan sekali (press-release-spring) dengan garis kejut
          const tb = m + 1.45;
          tl.fromTo(P + "btn", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, tb);
          tl.to(P + "btn", { scale: 0.92, duration: 0.14, ease: "power1.in" }, tb + 0.75);
          tl.to(P + "btn", { scale: 1, duration: 0.5, ease: "back.out(2)" }, tb + 0.89);
          tl.fromTo(P + "burst", { scale: 1, opacity: 0 }, { scale: 1.25, opacity: 1, duration: 0.25, ease: "power2.out" }, tb + 0.89);
          tl.to(P + "burst", { opacity: 0, duration: 0.45, ease: "power2.in" }, tb + 1.14);

          // Baris Telegram masuk terakhir, lalu semuanya ditahan untuk dibaca
          document.querySelectorAll("#{{ID}} .tg").forEach((el, i) => {
            tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, tb + 1.1 + i * 0.2);
          });

          window.__timelines["{{ID}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
