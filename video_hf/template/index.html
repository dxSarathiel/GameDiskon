<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url(assets/fonts/archivo-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Archivo"; src: url(assets/fonts/archivo-latin-ext.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2C60-2C7F, U+A720-A7FF; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a0b12; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0a0b12; font-family: "Archivo", system-ui, sans-serif; }
      #root > div[data-composition-src] { position: absolute; inset: 0; }
      .grid-cells { position: absolute; inset: 0; pointer-events: none; }
      .grid-cells i { position: absolute; display: block; width: 270px; height: 320px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="harian" data-width="1080" data-height="1920" data-start="0" data-duration="{{DURASI}}">
{{SLOTS}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
{{TRANSISI}}
      window.__timelines["harian"] = tl;
    </script>
  </body>
</html>
