<!DOCTYPE html>
<html lang="id">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Archivo"; src: url(assets/fonts/archivo-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%;
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: "Archivo"; src: url(assets/fonts/archivo-latin-ext.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%;
          unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2C60-2C7F, U+A720-A7FF; }
        #pembuka { position: absolute; inset: 0; overflow: hidden; color: #eef1f7; font-family: "Archivo", system-ui, sans-serif; }
        #pembuka .abs { position: absolute; }
        #pembuka .lime { color: #b8f229; }
        /* sampul game #1 mengintip: rotasi di pembungkus statis, gerak di dalamnya */
        #pembuka .cover-rot { left: 560px; top: 1250px; width: 640px; height: 366px; transform: rotate(-7deg); }
        #pembuka-cover { display: block; width: 100%; height: 100%; border-radius: 26px; background-size: cover; background-position: center; opacity: 0; }
        #pembuka .ghost-rot { left: 430px; top: 1560px; transform: rotate(-7deg); }
        #pembuka-ghost { display: block; overflow: visible; opacity: 0; }
        #pembuka-logo { left: 72px; top: 230px; display: flex; align-items: center; gap: 22px; }
        #pembuka-tag { display: block; width: 78px; height: 78px; }
        #pembuka .wm { display: flex; font-size: 64px; font-weight: 900; font-stretch: 118%; letter-spacing: -0.005em; line-height: 1; }
        #pembuka .wm span { display: inline-block; opacity: 0; }
        #pembuka-kicker { left: 72px; top: 470px; font-size: 40px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #b8f229; opacity: 0; }
        #pembuka-judul { left: 72px; top: 540px; width: 860px; font-size: 140px; font-weight: 900; font-stretch: 118%; text-transform: uppercase; line-height: 0.98; letter-spacing: -0.005em; }
        #pembuka-judul .ln { display: block; opacity: 0; }
        #pembuka-sub { left: 72px; top: 1010px; width: 760px; font-size: 54px; line-height: 1.3; color: #9ba5ba; opacity: 0; }
        #pembuka-pill { left: 72px; top: 1200px; display: block; font-size: 46px; font-weight: 900; padding: 18px 34px; border-radius: 999px;
          background: #ff4d8d; color: #0a0d13; box-shadow: 0 0 40px rgba(255, 77, 141, 0.5); transform-origin: 0% 50%; opacity: 0; }
        #pembuka-tgl { left: 72px; top: 1460px; font-size: 46px; font-weight: 700; color: #9ba5ba; opacity: 0; }
      </style>

      <div id="pembuka" data-composition-id="pembuka" data-width="1080" data-height="1920">
        <div class="abs cover-rot" data-layout-allow-overflow=""><div id="pembuka-cover" data-layout-allow-overflow="" style="background-image: url('assets/sampul/steam-1.jpg')"></div></div>
        <div class="abs ghost-rot" data-layout-allow-overflow=""><svg id="pembuka-ghost" aria-hidden="true" data-layout-allow-overflow="" width="760" height="300" viewBox="0 0 760 300"><text x="0" y="250" font-family="Archivo, system-ui, sans-serif" font-size="280" font-weight="900" font-stretch="75%" fill="rgba(184,242,41,0.42)">-95%</text></svg></div>

        <div class="abs" id="pembuka-logo">
          <svg id="pembuka-tag" viewBox="0 0 24 24"><rect width="24" height="24" rx="5.3" fill="#b8f229" /><g transform="translate(4.56 4.56) scale(.62)" fill="none" stroke="#0a0d13" stroke-width="2.4" stroke-linejoin="round"><path d="M3 3H13L20.6 10.6Q21.4 12 20.6 13.4L13.4 20.6Q12 21.4 10.6 20.6L3 13Z" /><circle cx="7.5" cy="7.5" r="1.6" fill="#0a0d13" stroke="none" /></g></svg>
          <div class="wm"><span id="pembuka-w1">GAME</span><span id="pembuka-w2" class="lime">DISKON</span></div>
        </div>
        <div class="abs" id="pembuka-kicker">Diskon Steam&#160;&#160;4 Okt</div>
        <div class="abs" id="pembuka-judul">
          <span class="ln" id="pembuka-l1">5 diskon</span>
          <span class="ln" id="pembuka-l2">Steam</span>
          <span class="ln lime" id="pembuka-l3">hari ini</span>
        </div>
        <div class="abs" id="pembuka-sub">Harga Rupiah asli, dicek langsung ke Steam Indonesia.</div>
        <div class="abs" id="pembuka-pill">+ GAME GRATIS</div>
        <div class="abs" id="pembuka-tgl">Minggu, 4 Okt 2026</div>
      </div>

      <script>
        (function () {
          const D = {"mulai": 0.0, "durasi": 3.929};
          const P = "#pembuka-";
          const tl = gsap.timeline({ paused: true });
          const m = D.mulai;

          // Logo: tag spring-pop (power3, tanpa pantul), lalu wordmark waterfall
          tl.fromTo(P + "tag", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, m + 0.05);
          tl.set(P + "w1", { opacity: 1, y: 45 }, m + 0.18);
          tl.to(P + "w1", { y: 0, duration: 0.16, ease: "power4.out" }, m + 0.18);
          tl.set(P + "w2", { opacity: 1, y: 45 }, m + 0.32);
          tl.to(P + "w2", { y: 0, duration: 0.16, ease: "power4.out" }, m + 0.32);

          tl.fromTo(P + "kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, m + 0.35);

          // Judul: waterfall-entry — biner 0→1, baris terakhir (lime) paling jauh & paling akhir
          const F = 1 / 60;
          let t = m + 0.45;
          [["l1", 80, 0.2], ["l2", 50, 0.16], ["l3", 75, 0.18]].forEach(([id, dy, d], i) => {
            tl.set(P + id, { opacity: 1, y: dy }, t);
            tl.to(P + id, { y: 0, duration: d, ease: "power4.out" }, t);
            t += d - (i === 0 ? -2 * F : F);
          });

          tl.fromTo(P + "sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, m + 1.0);
          if (document.querySelector(P + "pill")) {
            tl.fromTo(P + "pill", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, m + 1.25);
          }
          tl.fromTo(P + "tgl", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, m + 1.45);

          // Sampul game #1 meluncur masuk lalu hanyut pelan; "-NN%" hantu naik pelan
          tl.fromTo(P + "cover", { x: 300, opacity: 0 }, { x: 0, opacity: 0.38, duration: 1.0, ease: "power3.out" }, m + 0.3);
          tl.to(P + "cover", { x: -40, duration: Math.max(0.5, D.durasi - m - 1.3), ease: "none" }, m + 1.3);
          tl.fromTo(P + "ghost", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 1.2, ease: "power2.out" }, m + 0.6);
          tl.to(P + "ghost", { y: -30, duration: Math.max(0.5, D.durasi - m - 1.8), ease: "none" }, m + 1.8);

          window.__timelines["pembuka"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
