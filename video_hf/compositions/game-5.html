<!DOCTYPE html>
<html lang="id">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Archivo"; src: url(assets/fonts/archivo-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%;
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: "Archivo"; src: url(assets/fonts/archivo-latin-ext.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%;
          unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2C60-2C7F, U+A720-A7FF; }
        #game-5 { position: absolute; inset: 0; overflow: hidden; color: #eef1f7; font-family: "Archivo", system-ui, sans-serif; }
        /* Tumpukan di tengah layar, titik tengah sedikit di atas tengah (zona caption TikTok di bawah) */
        #game-5 .stack { position: absolute; inset: 0; padding: 110px 54px 330px; display: flex; flex-direction: column; justify-content: center; }
        #game-5 .prog { display: flex; gap: 14px; }
        #game-5 .seg { flex: 1; display: block; height: 10px; border-radius: 99px; background: #262f42; overflow: hidden; }
        #game-5 .seg b { display: block; width: 100%; height: 100%; border-radius: 99px; background: #b8f229; transform-origin: 0% 50%; }
        #game-5 .seg.kosong b { transform: scaleX(0); }
        #game-5-kicker { margin: 30px 0 34px; font-size: 40px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #b8f229; opacity: 0; }
        #game-5 .card { position: relative; border-radius: 40px; background: #121722; border: 3px solid #262f42; overflow: hidden; }
        #game-5 .cover { position: relative; height: 557px; overflow: hidden; }
        #game-5-img { position: absolute; inset: -30px; display: block; background-size: cover; background-position: center; }
        #game-5-badge { position: absolute; left: 30px; top: 30px; display: block; font-size: 34px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
          padding: 12px 22px; border-radius: 999px; background: #0a0d13; color: #b8f229; border: 3px solid #b8f229; opacity: 0; transform-origin: 0% 50%; }
        #game-5 .body { padding: 50px 100px 56px 54px; display: flex; flex-direction: column; gap: 34px; }
        #game-5-nama { font-size: 86px; font-weight: 800; line-height: 1.06; opacity: 0;
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        #game-5 .rrow { display: flex; justify-content: space-between; align-items: baseline; font-size: 44px; color: #9ba5ba; }
        #game-5-rnum { font-size: 50px; font-weight: 900; font-stretch: 75%; font-variant-numeric: tabular-nums; color: #eef1f7; }
        #game-5 .track { margin-top: 14px; height: 14px; border-radius: 99px; background: #262f42; overflow: hidden; }
        #game-5-rfill { display: block; width: 100%; height: 100%; border-radius: 99px; background: #5cd2ff; transform-origin: 0% 50%; }
        #game-5-rating { opacity: 0; }
        #game-5 .harga { display: flex; align-items: center; gap: 30px; }
        #game-5 .chip-wrap { position: relative; display: block; flex: none; }
        #game-5-burst { position: absolute; inset: -30px; display: block; border-radius: 999px; background: radial-gradient(closest-side, rgba(184, 242, 41, 0.55), rgba(184, 242, 41, 0)); opacity: 0; }
        #game-5-chip { position: relative; display: block; font-size: 96px; font-weight: 900; font-stretch: 75%; line-height: 1.15; padding: 16px 28px; border-radius: 999px;
          background: #b8f229; color: #0a0d13; box-shadow: 0 0 40px rgba(184, 242, 41, 0.45); font-variant-numeric: tabular-nums; }
        #game-5 .hcol { display: block; }
        #game-5-now { display: block; font-size: 134px; font-weight: 900; font-stretch: 75%; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; transform-origin: 0% 60%; }
        #game-5 .was { position: relative; display: inline-block; margin-top: 8px; font-size: 46px; color: #9ba5ba; opacity: 0; }
        #game-5-strike { position: absolute; left: -4px; right: -4px; top: 52%; display: block; height: 4px; border-radius: 2px; background: #9ba5ba; transform-origin: 0% 50%; }
      </style>

      <div id="game-5" data-composition-id="game-5" data-width="1080" data-height="1920">
        <div class="stack">
          <div class="prog"><i class="seg"><b></b></i><i class="seg"><b></b></i><i class="seg"><b></b></i><i class="seg"><b></b></i><i class="seg"><b id="game-5-seg"></b></i></div>
          <div id="game-5-kicker">Diskon 5 dari 5</div>
          <div class="card">
            <div class="cover">
              <div id="game-5-img" data-layout-allow-overflow="" style="background-image: url('assets/sampul/steam-5.jpg')"></div>
              
            </div>
            <div class="body">
              <div id="game-5-nama">Metro 2033 Redux</div>
              <div id="game-5-rating">
                <div class="rrow"><span>Ulasan positif di Steam</span><span id="game-5-rnum">88%</span></div>
                <div class="track"><div id="game-5-rfill"></div></div>
              </div>
              <div class="harga">
                <div class="chip-wrap"><div id="game-5-burst"></div><div id="game-5-chip">-90%</div></div>
                <div class="hcol">
                  <div id="game-5-now">Rp 21.400</div>
                  <div class="was" id="game-5-was">Rp 214.000<i id="game-5-strike"></i></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const D = {"mulai": 0.338, "durasi": 5.953, "nomor": 5, "rating": 88, "awal": 214000, "akhir": 21400};
          const P = "#game-5-";
          const tl = gsap.timeline({ paused: true });
          const m = D.mulai;
          const rp = (v) => "Rp " + String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

          // Kamera pelan pada sampul — arah bergantian per nomor game
          const arah = D.nomor % 2 ? 1 : -1;
          tl.fromTo(P + "img", { scale: 1, x: -18 * arah }, { scale: 1.06, x: 18 * arah, duration: D.durasi, ease: "none" }, 0);

          // Segmen progres ke-n terisi (stat-bars-and-fills, progress)
          tl.fromTo(P + "seg", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, m);
          tl.fromTo(P + "kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, m + 0.05);

          // Nama: waterfall-entry (biner 0→1)
          tl.set(P + "nama", { opacity: 1, y: 50 }, m + 0.15);
          tl.to(P + "nama", { y: 0, duration: 0.2, ease: "power4.out" }, m + 0.15);

          // Rating: angka & bar terisi bersamaan (counting + progress fill)
          const r = { v: 0 };
          const rnum = document.querySelector(P + "rnum");
          tl.set(P + "rating", { opacity: 1 }, m + 0.35);
          tl.fromTo(P + "rfill", { scaleX: 0 }, { scaleX: D.rating / 100, duration: 0.9, ease: "power2.out" }, m + 0.4);
          tl.fromTo(r, { v: 0 }, { v: D.rating, duration: 0.9, ease: "power2.out", immediateRender: false, onUpdate: () => { rnum.textContent = Math.round(r.v) + "%"; } }, m + 0.4);

          // HARGA TURUN — counting-dynamic-scale: nilai turun, skala tumbuh (harga murah jadi pahlawan)
          const turun = Math.min(1.3, Math.max(0.8, D.durasi - m - 1.9));
          const t0 = m + 0.75;
          const now = document.querySelector(P + "now");
          const h = { v: D.awal };
          // Penahan dari detik 0 sampai harga mulai turun: rating "0%" dan harga awal (seek mundur tetap benar)
          const tahan = { p: 0 };
          tl.fromTo(tahan, { p: 0 }, { p: 1, duration: t0, ease: "none", onUpdate: () => {
            if (tahan.p * t0 < m + 0.4) rnum.textContent = "0%";
            now.textContent = rp(D.awal);
          } }, 0);
          tl.fromTo(h, { v: D.awal }, { v: D.akhir, duration: turun, ease: "power3.out", immediateRender: false, onUpdate: () => { now.textContent = rp(h.v); } }, t0);
          tl.fromTo(now, { scale: 0.82 }, { scale: 1, duration: turun, ease: "power3.out" }, t0);
          tl.fromTo(P + "was", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, t0 + 0.1);
          tl.fromTo(P + "strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, t0 + turun - 0.25);

          // Chip potongan: spring-pop, lalu ditekan sekali (press-release-spring) bila waktunya cukup
          const tc = t0 + turun - 0.1;
          tl.fromTo(P + "chip", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, tc);
          if (tc + 1.05 < D.durasi) {
            tl.to(P + "chip", { scale: 0.9, duration: 0.12, ease: "power1.in" }, tc + 0.5);
            tl.to(P + "chip", { scale: 1, duration: 0.45, ease: "back.out(2)" }, tc + 0.62);
            tl.fromTo(P + "burst", { scale: 1, opacity: 0 }, { scale: 1.35, opacity: 1, duration: 0.25, ease: "power2.out" }, tc + 0.62);
            tl.to(P + "burst", { opacity: 0, duration: 0.4, ease: "power2.in" }, tc + 0.87);
          }
          if (document.querySelector(P + "badge")) {
            tl.fromTo(P + "badge", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, tc + 0.2);
          }

          window.__timelines["game-5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
